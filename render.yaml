services:
  - type: web
    name: elevatebox-voice-backend
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    preDeployCommand: python scripts/migrate.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Callbacks are claimed with SELECT ... FOR UPDATE SKIP LOCKED, so extra
    # instances would be safe, but one keeps the scheduler's polling minimal.
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: sales-agent-assets
      - key: SUPABASE_RESUME_OBJECT_PATH
        sync: false
      - key: SUPABASE_ARCHITECTURE_OBJECT_PATH
        sync: false
      - key: WHAPI_BASE_URL
        value: https://gate.whapi.cloud
      - key: WHAPI_TOKEN
        sync: false
      - key: SARVAM_TOOL_SECRET
        sync: false
      - key: SARVAM_API_BASE
        value: https://apps.sarvam.ai
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_APP_VERSION
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: DEVELOPER_NAME
        sync: false
      - key: DEVELOPER_PHONE
        sync: false
